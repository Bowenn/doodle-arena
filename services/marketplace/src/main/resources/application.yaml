spring:
  application:
    name: marketplace
  lifecycle:
    # On SIGTERM, in-flight requests get this long to finish.
    timeout-per-shutdown-phase: 10s
  main:
    banner-mode: "off"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:marketplace}
    username: ${DB_USER:marketplace}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jackson:
    # JSON fields are snake_case, like every other service's API (design doc, section 6.3).
    property-naming-strategy: SNAKE_CASE
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: marketplace
      # A new consumer group starts at the beginning: every drawing already approved gets minted.
      auto-offset-reset: earliest
      enable-auto-commit: false
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        enable.idempotence: true
        # Fail a send within seconds when Kafka is down, so the relay's batch gives up and retries
        # on its next pass instead of holding its database transaction for a minute.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    listener:
      # Commit a record's offset only after the listener returned, so after its transaction committed.
      ack-mode: record
      auto-startup: ${KAFKA_LISTENERS_ENABLED:true}
  flyway:
    # Migrations run at startup; Flyway's advisory lock keeps two starting instances apart.
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful

app:
  version: ${SERVICE_VERSION:dev}
  instance: ${SERVICE_INSTANCE_ID:${HOSTNAME:local}}
  jwt:
    # ADR 0001: RS256 access tokens from auth, verified here against its JWKS.
    jwks-url: ${AUTH_JWKS_URL:http://localhost:8080/api/auth/.well-known/jwks.json}
    issuer: ${JWT_ISSUER:http://localhost:8080/api/auth}
    audience: doodle-api
  stripe:
    # Test-mode keys only (docs/setup.md). Without a secret key, checkout and the webhook answer 503.
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    api-base: ${STRIPE_API_BASE:https://api.stripe.com}
    # Where Checkout sends the browser back to (the web app's wallet page, task 4.8).
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    # The coin packs for sale (design doc, section 7.7), priced inline in Checkout.
    coin-packs:
      - { id: small, coins: 100, price-cents: 99, currency: usd }
      - { id: medium, coins: 550, price-cents: 499, currency: usd }
      - { id: large, coins: 1200, price-cents: 999, currency: usd }
  rewards:
    # Coins per placement (design doc, section 7.9): 1st, 2nd, 3rd; everyone else gets participation-coins.
    # Players with equal scores share a placement, so they get the same amount.
    placement-coins: 30, 20, 10
    participation-coins: 5
  outbox:
    # How often the relay looks for unpublished events.
    interval: 500ms
  reconciliation:
    interval: 60s
    # The gauges stop reporting when the last successful run is older than this.
    stale-after: 3m

logging:
  structured:
    format:
      # JSON lines in the format from docs/observability.md, section 2.
      console: com.doodlearena.marketplace.logging.JsonLogFormatter
