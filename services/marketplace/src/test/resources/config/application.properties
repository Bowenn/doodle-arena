# Tests that need Kafka start their own broker and turn the listeners back on
# (DrawingEventsListenerTests); everywhere else they would only retry connecting to localhost:9092.
spring.kafka.listener.auto-startup=false
# The same for the outbox relay (OutboxRelayTests turns it back on).
app.outbox.relay-enabled=false
# The same for the drops sweeper (the drop tests call it themselves).
app.drops.sweeper-enabled=false
