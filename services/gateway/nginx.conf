# Doodle Arena gateway: reverse proxy for every service (design doc, section 4.1).
# The gateway only routes. Each service verifies JWTs itself (ADR 0001).

worker_processes auto;
error_log /dev/stderr notice;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # One JSON object per request. The path is logged without its query string, because
    # query strings can carry OAuth codes and other secrets. trace_id and span_id arrive
    # with ngx_otel_module in task 1.5.
    log_format json escape=json
        '{"timestamp":"$time_iso8601","level":"info","service":"gateway","version":"0.1.0",'
        '"msg":"request","request_id":"$request_id","method":"$request_method","path":"$uri",'
        '"status":$status,"duration_s":$request_time,"upstream":"$upstream_addr"}';
    access_log /dev/stdout json;

    # Docker's embedded DNS. Resolving at request time lets the gateway start, and keep
    # running, while a service is down or restarting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Defaults for every proxied location; long-lived WebSockets override the read timeout.
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # /healthz/<service> targets. Restricted to internal traffic in AWS (ADR 0003).
    map $health_service $health_url {
        default        "";
        auth           http://auth:8080/healthz;
        lobby          http://lobby:8080/healthz;
        game-server-1  http://game-server-1:8080/healthz;
        game-server-2  http://game-server-2:8080/healthz;
        assets         http://assets:8080/healthz;
        ai             http://ai:8080/healthz;
        marketplace    http://marketplace:8080/healthz;
        notifier       http://notifier:8080/healthz;
        web            http://web:5173/;
    }

    server {
        listen 80;
        client_max_body_size 1m;

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}\n';
        }

        location ~ ^/healthz/(?<health_service>[a-z0-9-]+)$ {
            access_log off;
            if ($health_url = "") {
                return 404;
            }
            include /etc/nginx/proxy_common.conf;
            proxy_pass $health_url;
        }

        # Public API routes keep their full path; each service owns its prefix.
        location /api/auth/ {
            include /etc/nginx/proxy_common.conf;
            set $upstream auth:8080;
            proxy_pass http://$upstream;
        }

        location /api/lobby/ {
            include /etc/nginx/proxy_common.conf;
            set $upstream lobby:8080;
            proxy_pass http://$upstream;
        }

        location /api/assets/ {
            include /etc/nginx/proxy_common.conf;
            set $upstream assets:8080;
            proxy_pass http://$upstream;
        }

        location /admin/ {
            include /etc/nginx/proxy_common.conf;
            set $upstream assets:8080;
            proxy_pass http://$upstream;
        }

        location /api/market/ {
            include /etc/nginx/proxy_common.conf;
            set $upstream marketplace:8080;
            proxy_pass http://$upstream;
        }

        location /api/notifier/ {
            include /etc/nginx/proxy_common.conf;
            set $upstream notifier:8080;
            proxy_pass http://$upstream;
        }

        # Game WebSockets: routing depends on ADR 0002 (task 2.2 and 2.5).
        location /ws/ {
            default_type application/json;
            return 404 '{"error":{"code":"NOT_IMPLEMENTED","message":"WebSocket routing arrives in Stage 2"}}\n';
        }

        # Everything else is the web app (the Vite dev server locally, including its
        # hot-reload WebSocket).
        location / {
            include /etc/nginx/proxy_common.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            set $upstream web:5173;
            proxy_pass http://$upstream;
        }
    }
}
