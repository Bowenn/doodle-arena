# Included by every proxied location.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $request_id;

# Identity comes only from the JWT that each service verifies (ADR 0001). Clear these
# headers so nobody can add a trusted-header shortcut later by accident.
proxy_set_header X-User-Id "";
proxy_set_header X-User-Roles "";
proxy_set_header X-Roles "";
