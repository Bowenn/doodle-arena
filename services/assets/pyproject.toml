[project]
name = "doodle-assets"
version = "0.1.0"
description = "Doodle Arena assets service: render, store, moderate and list drawings; replays"
requires-python = "==3.14.*"
dependencies = [
    "boto3>=1.43.114",
    "celery[redis]>=5.6.3",
    "confluent-kafka>=2.16.0",
    "django>=6.1.2",
    "doodle-proto",
    "gunicorn>=26.2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-botocore>=0.66b1",
    "opentelemetry-instrumentation-celery>=0.66b1",
    "opentelemetry-instrumentation-django>=0.66b1",
    "opentelemetry-instrumentation-logging>=0.66b1",
    "opentelemetry-instrumentation-psycopg>=0.66b1",
    "opentelemetry-instrumentation-pymongo>=0.66b1",
    "opentelemetry-instrumentation-system-metrics>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pyjwt[crypto]>=2.15.1",
    "pymongo>=4.19.0",
    "whitenoise>=6.12.0",
]

[tool.uv]
required-version = ">=0.13"
package = false

[tool.uv.sources]
doodle-proto = { path = "../../proto/gen/python", editable = true }

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Django's Meta options, ModelAdmin options and migrations are mutable class attributes by design.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Generated by makemigrations.
"*/migrations/*" = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy", "mypy_django_plugin.main"]

[[tool.mypy.overrides]]
# No type hints in these packages.
module = ["gunicorn.*", "opentelemetry.instrumentation.django", "opentelemetry.instrumentation.celery", "opentelemetry.instrumentation.psycopg"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.test_settings"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "config.test_settings"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.114",
    "celery-types>=0.26.0",
    "django-stubs>=6.1.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
    "testcontainers[kafka,mongodb,postgres,redis]>=4.15.0",
]
