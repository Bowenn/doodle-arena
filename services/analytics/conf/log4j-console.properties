# Flink's console logging (the image's file, replaced): one JSON object per line on stdout, in
# the services' format (docs/observability.md, section 2). trace_id and span_id come from the
# OpenTelemetry agent's MDC when a line belongs to a span (a Kafka record's processing).
monitorInterval = 30

rootLogger.level = INFO
rootLogger.appenderRef.console.ref = ConsoleAppender

appender.console.name = ConsoleAppender
appender.console.type = CONSOLE
appender.console.layout.type = JsonTemplateLayout
appender.console.layout.eventTemplate = {"timestamp":{"$resolver":"timestamp","pattern":{"format":"yyyy-MM-dd'T'HH:mm:ss.SSS'Z'","timeZone":"UTC"}},"level":{"$resolver":"pattern","pattern":"%level{lowerCase=true}"},"service":"analytics","version":"${env:SERVICE_VERSION:-dev}","trace_id":{"$resolver":"mdc","key":"trace_id"},"span_id":{"$resolver":"mdc","key":"span_id"},"logger":{"$resolver":"logger","field":"name"},"msg":{"$resolver":"message","stringified":true},"error":{"$resolver":"exception","field":"stackTrace","stackTrace":{"stringified":true}}}

# The Kafka clients and Flink's internals are chatty at INFO.
logger.kafka.name = org.apache.kafka
logger.kafka.level = WARN
logger.akka.name = org.apache.pekko
logger.akka.level = WARN
