# Auth service (FastAPI, and its outbox relay): lint, test (Testcontainers Postgres and Kafka),
# Docker build from the repository root (for proto/gen/python).
name: auth

on:
  pull_request:
    paths:
      - services/auth/**
      - proto/gen/python/**
      - fixtures/jwt/**
      - .github/workflows/auth.yml
      - .github/workflows/_python.yml
      - scripts/test.sh
      - scripts/ci-pull.sh
      - scripts/lint.sh
      - scripts/services.sh
      - .github/workflows/_docker.yml
  push:
    branches: [master]
    paths:
      - services/auth/**
      - proto/gen/python/**
      - fixtures/jwt/**
      - .github/workflows/auth.yml
      - .github/workflows/_python.yml
      - scripts/test.sh
      - scripts/ci-pull.sh
      - scripts/lint.sh
      - scripts/services.sh
      - .github/workflows/_docker.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; let every run on master finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    uses: ./.github/workflows/_python.yml
    with:
      service: auth
      directory: services/auth

  docker:
    uses: ./.github/workflows/_docker.yml
    with:
      service: auth
      context: .
      file: services/auth/Dockerfile
