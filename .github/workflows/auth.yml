# Auth service (FastAPI): lint, test (Testcontainers Postgres), Docker build.
name: auth

on:
  pull_request:
    paths:
      - services/auth/**
      - fixtures/jwt/**
      - .github/workflows/auth.yml
      - .github/workflows/_python.yml
      - scripts/test.sh
      - scripts/lint.sh
      - scripts/services.sh
      - .github/workflows/_docker.yml
  push:
    branches: [master]
    paths:
      - services/auth/**
      - fixtures/jwt/**
      - .github/workflows/auth.yml
      - .github/workflows/_python.yml
      - scripts/test.sh
      - scripts/lint.sh
      - scripts/services.sh
      - .github/workflows/_docker.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; let every run on master finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    uses: ./.github/workflows/_python.yml
    with:
      service: auth
      directory: services/auth

  docker:
    uses: ./.github/workflows/_docker.yml
    with:
      service: auth
      context: services/auth
