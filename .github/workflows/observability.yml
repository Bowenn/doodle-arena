# Checks dashboards, alert rules and runbooks against each other and docs/observability.md, the
# same check as `make lint s=observability`. The stack job (stack.yml) checks them live.
name: observability

on:
  pull_request:
    paths:
      - infra/observability/**
      - docs/runbooks/**
      - docs/observability.md
      - scripts/observability-lint.py
      - scripts/lint.sh
      - .github/workflows/observability.yml
  push:
    branches: [master]
    paths:
      - infra/observability/**
      - docs/runbooks/**
      - docs/observability.md
      - scripts/observability-lint.py
      - scripts/lint.sh
      - .github/workflows/observability.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: dashboards, rules and runbooks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: false
      - name: Lint
        run: ./scripts/lint.sh observability
