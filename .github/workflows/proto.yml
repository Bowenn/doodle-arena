# Contracts: buf format, lint and breaking-change check, and a check that the committed
# generated code (proto/gen) is exactly what `make proto` produces in all three languages.
name: proto

on:
  pull_request:
    paths:
      - proto/**
      - scripts/proto.sh
      - tools/eventctl/fixtures/**
      - .github/workflows/proto.yml
  push:
    branches: [master]
    paths:
      - proto/**
      - scripts/proto.sh
      - tools/eventctl/fixtures/**
      - .github/workflows/proto.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: lint, breaking, generated code
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # buf breaking compares against an earlier commit
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: "1.74.0"
          setup_only: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: proto/gen/go/go.mod
          cache-dependency-path: proto/gen/go/go.sum
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: proto/gen/python/uv.lock

      - name: Breaking-change check
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) against="$PR_BASE_SHA" ;;
            push) against="$PUSH_BEFORE" ;;
            *) against="$(git rev-parse origin/master)" ;;
          esac
          if [[ -z "$against" || "$against" =~ ^0+$ ]]; then
            echo "No earlier commit to compare against; skipping."
            exit 0
          fi
          if ! git cat-file -e "$against:proto/buf.yaml" 2>/dev/null; then
            echo "proto/ did not exist at $against; nothing to compare."
            exit 0
          fi
          buf breaking proto --against ".git#ref=$against,subdir=proto"

      - name: Lint and regenerate (make proto)
        run: ./scripts/proto.sh

      - name: Generated code is up to date
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --porcelain
            git diff --stat
            echo "::error::proto/gen is stale. Run 'make proto' and commit the result."
            exit 1
          fi
