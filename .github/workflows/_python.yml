# Reusable: lint and test one Python service with the same scripts as `make lint` and
# `make test`. uv installs the Python version pinned in the service's .python-version.
name: python

on:
  workflow_call:
    inputs:
      service:
        description: Name known to scripts/services.sh, for example auth
        type: string
        required: true
      directory:
        description: Folder of the uv project
        type: string
        required: true
      runner:
        description: The runner image (assets needs ubuntu-22.04 for MongoDB, see stack.yml)
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  lint-test:
    name: lint and test
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    env:
      SERVICE: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: ${{ inputs.directory }}/uv.lock
      - name: Lint (ruff, mypy)
        run: ./scripts/lint.sh "$SERVICE"
      - name: Test (pytest; Testcontainers uses the runner's Docker)
        run: ./scripts/test.sh "$SERVICE"
