# Assets service (Django): lint, test, Docker build.
name: assets

on:
  pull_request:
    paths:
      - services/assets/**
      - proto/gen/python/**
      - fixtures/jwt/**
      - .github/workflows/assets.yml
      - .github/workflows/_python.yml
      - scripts/test.sh
      - scripts/ci-pull.sh
      - scripts/lint.sh
      - scripts/services.sh
      - .github/workflows/_docker.yml
  push:
    branches: [master]
    paths:
      - services/assets/**
      - proto/gen/python/**
      - fixtures/jwt/**
      - .github/workflows/assets.yml
      - .github/workflows/_python.yml
      - scripts/test.sh
      - scripts/ci-pull.sh
      - scripts/lint.sh
      - scripts/services.sh
      - .github/workflows/_docker.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; let every run on master finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    uses: ./.github/workflows/_python.yml
    with:
      service: assets
      directory: services/assets
      # Its tests start MongoDB 8.0, which refuses kernels 6.19 to 7.0.13 (ubuntu-24.04's now).
      runner: ubuntu-22.04

  docker:
    uses: ./.github/workflows/_docker.yml
    with:
      service: assets
      context: .
      file: services/assets/Dockerfile
