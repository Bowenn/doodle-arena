# Reusable: build one service's Docker image, as compose does. Nothing is pushed yet; image
# publishing comes with the AWS deployment (Stage 5).
name: docker

on:
  workflow_call:
    inputs:
      service:
        description: Image name and cache scope, for example lobby
        type: string
        required: true
      context:
        description: Build context folder
        type: string
        required: true
      file:
        description: Dockerfile path, when it isn't <context>/Dockerfile
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: linux/amd64
          push: false
          tags: doodle-arena/${{ inputs.service }}:ci
          # Layer cache in the GitHub Actions cache, one scope per service.
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
