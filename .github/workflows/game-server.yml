# Game server (Go): lint, test with -race, Docker build.
name: game-server

on:
  pull_request:
    paths:
      - services/game-server/**
      - proto/gen/go/**
      - .github/workflows/game-server.yml
      - .github/workflows/_go.yml
      - scripts/test.sh
      - scripts/lint.sh
      - scripts/services.sh
      - .github/workflows/_docker.yml
  push:
    branches: [master]
    paths:
      - services/game-server/**
      - proto/gen/go/**
      - .github/workflows/game-server.yml
      - .github/workflows/_go.yml
      - scripts/test.sh
      - scripts/lint.sh
      - scripts/services.sh
      - .github/workflows/_docker.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; let every run on master finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    uses: ./.github/workflows/_go.yml
    with:
      service: game-server
      directory: services/game-server

  docker:
    uses: ./.github/workflows/_docker.yml
    with:
      service: game-server
      context: .
      file: services/game-server/Dockerfile
