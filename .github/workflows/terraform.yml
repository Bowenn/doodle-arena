# Checks the Terraform (infra/terraform/) offline, the same check as `make lint s=terraform`:
# formatting, both roots and the service module validated without AWS access, then tflint. It
# never plans or applies: that needs the account, and happens from a developer's machine
# (scripts/aws/up.sh, ADR 0003). It also runs the unit tests of the backup's logic
# (scripts/aws/backups.py, ADR 0016), as `make test s=terraform` does.
name: terraform

on:
  pull_request:
    paths:
      - infra/terraform/**
      - infra/backup/**
      - scripts/aws/**
      - scripts/lint.sh
      - scripts/test.sh
      - scripts/ci-pull.sh
      - .github/workflows/terraform.yml
  push:
    branches: [master]
    paths:
      - infra/terraform/**
      - infra/backup/**
      - scripts/aws/**
      - scripts/lint.sh
      - scripts/test.sh
      - scripts/ci-pull.sh
      - .github/workflows/terraform.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: fmt, validate, tflint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false
      - name: Lint
        run: ./scripts/lint.sh terraform
      - name: Test the backup logic (ADR 0016)
        run: ./scripts/test.sh terraform
