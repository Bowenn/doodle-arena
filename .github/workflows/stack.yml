# Boots the whole local stack (make up) and runs make smoke: every /healthz through the
# gateway, plus the gateway's rate limit. Runs only when the stack itself changes, on master,
# and on demand, because it takes about five runner-minutes.
name: stack

on:
  pull_request:
    paths:
      - infra/**
      - scripts/**
      - loadtest/**
      - services/gateway/**
      - services/*/Dockerfile
      - services/*/Dockerfile.dockerignore
      - web/Dockerfile
      - .env.example
      - Makefile
      - .github/workflows/stack.yml
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: make up and make smoke
    # Not ubuntu-24.04: its kernel is now in the 6.19 to 7.0.13 range, where MongoDB 8.0 refuses
    # to start (SERVER-121912; MongoDB's 8.0 release notes). Move back once the runner's kernel
    # is 7.0.14 or newer, or a MongoDB 8.0 patch supports it. Checked 2026-10-20 (task 5.5): no
    # MongoDB release fixes it yet (the bundled TCMalloc); Docker Desktop's 7.0.14 kernel is fine.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      # Show otel-lgtm's collector and Loki logs, so a failed export to Loki is explained.
      OTEL_LGTM_COMPONENT_LOGS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's disk is ~94% full once every service image is built, and Loki stops
      # accepting logs above 90% disk usage ("Ingester is shutting down"). Remove large
      # preinstalled toolchains this job never uses.
      - name: Kernel (MongoDB 8.0 refuses 6.19 to 7.0.13)
        run: uname -r
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af > /dev/null
          df -h /
      - name: make up (creates .env and the JWT key, builds every image, the opt-in parts included)
        run: PROFILES=live,analytics make up
      - name: make smoke
        run: make smoke
      - name: make telemetry-check (trace, logs and metrics reach Grafana)
        run: make telemetry-check
      - name: make pipeline-check (a round becomes an approved, stored, published drawing)
        run: make pipeline-check
      # analytics-check publishes and reads events with tools/eventctl.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false
      - name: make analytics-check (viewer guesses in, the Flink job's TopGuesses out, ADR 0018)
        run: make analytics-check
      - name: make kafka-acl-check (the broker refuses what each service must not do, ADR 0013)
        run: make kafka-acl-check
      - name: make data-acl-check (Redis and SeaweedFS refuse other services' keys and buckets)
        run: make data-acl-check
      - name: make alerts-check (dashboards, alert rules and the contact point load and evaluate)
        run: make alerts-check
      # uv runs the Python drills (wash-check) and the load test's token minting.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: false
      # Real sales through the marketplace close a round trip and a cycle across a restart of
      # Flink, and both flags come out of the job (ADR 0018). Needs uv, above.
      - name: make wash-check (wash trading end to end, with real sales and a Flink restart)
        run: make wash-check
      # Real tips through the gateway, a RoundFinished, the drawers paid out of escrow (ADR 0021).
      - name: make tips-check (tips into escrow, settled when the round finishes)
        run: make tips-check
      # The load test's script must keep working: two rooms for a minute, thresholds included.
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: "2.3.0"
      - name: make loadtest-smoke (k6, two four-player rooms through the gateway)
        run: make loadtest-smoke
      - name: make loadtest-live-smoke (k6, a live room and 50 viewers through the relays)
        run: make loadtest-live-smoke
      - name: Disk usage after the run
        if: always()
        run: df -h /
      - name: Show containers and logs
        if: failure()
        run: |
          docker compose -f infra/docker-compose.yml --env-file .env ps -a
          docker compose -f infra/docker-compose.yml --env-file .env logs --no-color --tail=200
      - name: Show Loki's own log lines
        if: failure()
        run: |
          # Loki logs in logfmt (lines start with level=); the collector's lines don't.
          docker compose -f infra/docker-compose.yml --env-file .env logs --no-color --no-log-prefix otel-lgtm |
            grep -E '^level=' | grep -v 'logproto.Pusher/Push' | head -120 || true
      - name: make down
        if: always()
        run: docker compose -f infra/docker-compose.yml --env-file .env down -v --remove-orphans
