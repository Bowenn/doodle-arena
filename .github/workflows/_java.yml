# Reusable: lint (compile with -Werror) and test one Gradle project with the same scripts as
# `make lint` and `make test`.
name: java

on:
  workflow_call:
    inputs:
      service:
        description: Name known to scripts/services.sh, for example marketplace
        type: string
        required: true

permissions:
  contents: read

jobs:
  lint-test:
    name: lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SERVICE: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      # Caches Gradle and checks that gradle-wrapper.jar is an official Gradle release.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Lint (compile with -Xlint:all -Werror)
        run: ./scripts/lint.sh "$SERVICE"
      - name: Test (JUnit 5)
        run: ./scripts/test.sh "$SERVICE"
