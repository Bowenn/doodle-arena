# AI service (FastAPI): lint, test, Docker build.
name: ai

on:
  pull_request:
    paths:
      - services/ai/**
      - .github/workflows/ai.yml
      - .github/workflows/_python.yml
      - scripts/test.sh
      - scripts/ci-pull.sh
      - scripts/lint.sh
      - scripts/services.sh
      - .github/workflows/_docker.yml
  push:
    branches: [master]
    paths:
      - services/ai/**
      - .github/workflows/ai.yml
      - .github/workflows/_python.yml
      - scripts/test.sh
      - scripts/ci-pull.sh
      - scripts/lint.sh
      - scripts/services.sh
      - .github/workflows/_docker.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; let every run on master finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    uses: ./.github/workflows/_python.yml
    with:
      service: ai
      directory: services/ai

  docker:
    uses: ./.github/workflows/_docker.yml
    with:
      service: ai
      context: services/ai
