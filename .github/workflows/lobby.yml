# Lobby service (Go): lint, test with -race, Docker build.
name: lobby

on:
  pull_request:
    paths:
      - services/lobby/**
      - fixtures/jwt/**
      - proto/gen/go/**
      - libs/go/**
      - .github/workflows/lobby.yml
      - .github/workflows/_go.yml
      - scripts/test.sh
      - scripts/ci-pull.sh
      - scripts/lint.sh
      - scripts/services.sh
      - .github/workflows/_docker.yml
  push:
    branches: [master]
    paths:
      - services/lobby/**
      - fixtures/jwt/**
      - proto/gen/go/**
      - libs/go/**
      - .github/workflows/lobby.yml
      - .github/workflows/_go.yml
      - scripts/test.sh
      - scripts/ci-pull.sh
      - scripts/lint.sh
      - scripts/services.sh
      - .github/workflows/_docker.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; let every run on master finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    uses: ./.github/workflows/_go.yml
    with:
      service: lobby
      directory: services/lobby

  docker:
    uses: ./.github/workflows/_docker.yml
    with:
      service: lobby
      context: .
      file: services/lobby/Dockerfile
