            datasourceUid: prometheus
            model:
              refId: B
              expr: "((sum(rate(http_server_request_duration_seconds_count{http_route=~\".*/api/.*\", service_name!~\"game-server|relay.*\"}[30m])) - sum(rate(http_server_request_duration_seconds_bucket{http_route=~\".*/api/.*\", service_name!~\"game-server|relay.*\", le=\"0.5\"}[30m])))) / sum(rate(http_server_request_duration_seconds_count{http_route=~\".*/api/.*\", service_name!~\"game-server|relay.*\"}[30m]))"
              instant: true
          - refId: T
