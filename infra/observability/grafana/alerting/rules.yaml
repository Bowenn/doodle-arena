              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: math
              # Burning the 30-day budget 6x too fast over both windows, with enough
              # traffic (more than 6 requests a minute) for a ratio to mean something.
              expression: "$A > 0.0600 && $B > 0.0600 && $T > 0.1"
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
