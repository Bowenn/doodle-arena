# Every alert goes to Discord, grouped per alert and service. critical means fix now and repeats
# hourly while it fires; warning means look today and repeats every 4 hours.
apiVersion: 1
policies:
  - orgId: 1
    receiver: discord
    group_by: [alertname, service, service_name, group]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: discord
        object_matchers:
          - [severity, "=", critical]
        repeat_interval: 1h
