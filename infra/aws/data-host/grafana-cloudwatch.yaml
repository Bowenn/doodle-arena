# AWS resources in Grafana (observability.md, section 1): CloudWatch through the data host's
# instance role, which may only read CloudWatch. Billing metrics live in us-east-1.
apiVersion: 1
datasources:
  - name: CloudWatch
    type: cloudwatch
    uid: cloudwatch
    editable: false
    jsonData:
      authType: default
      defaultRegion: us-west-2
