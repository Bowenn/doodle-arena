# AWS resources in Grafana (observability.md, section 1): CloudWatch through the data host's
# instance role. That role reads CloudWatch, the stack's config bucket and the data host's own
# SSM secrets, and is denied every other parameter (infra/terraform/stack/iam.tf). Billing
# metrics live in us-east-1.
apiVersion: 1
datasources:
  - name: CloudWatch
    type: cloudwatch
    uid: cloudwatch
    editable: false
    jsonData:
      authType: default
      defaultRegion: us-west-2
