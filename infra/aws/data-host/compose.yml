# The data host in AWS (ADR 0003): the stateful containers of infra/docker-compose.yml on one
# EC2 instance, for the ECS services in the VPC. The instance's user data unpacks this file with
# the init scripts and observability config it mounts into /opt/doodle, writes .env from SSM, and
# runs `docker compose up -d`. Ports are published on the host; the data host's security group
# decides which service reaches which port (ADR 0006). Grafana listens on 127.0.0.1 only: reach
# it with an SSM port forward (docs/setup.md, "AWS"). Only otel-lgtm can reach the instance
# role (host network, IMDS hop limit 1).

name: doodle-data

services:
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      ASSETS_DB_PASSWORD: ${ASSETS_DB_PASSWORD:?}
      MARKETPLACE_DB_PASSWORD: ${MARKETPLACE_DB_PASSWORD:?}
      NOTIFIER_DB_PASSWORD: ${NOTIFIER_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.2-trixie
    restart: unless-stopped
    # One ACL user per service and key prefix, the default user off (infra/redis/start.sh).
    entrypoint: ["sh", "/etc/doodle-arena/redis-start.sh"]
    environment:
      REDIS_ADMIN_PASSWORD: ${REDIS_ADMIN_PASSWORD:?}
      REDIS_LOBBY_PASSWORD: ${REDIS_LOBBY_PASSWORD:?}
      REDIS_GAME_SERVER_PASSWORD: ${REDIS_GAME_SERVER_PASSWORD:?}
      REDIS_ASSETS_PASSWORD: ${REDIS_ASSETS_PASSWORD:?}
    volumes:
      - redis-data:/data
      - ./redis/start.sh:/etc/doodle-arena/redis-start.sh:ro
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_ADMIN_PASSWORD\" redis-cli --user admin ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  mongo:
    image: mongo:8.0.34
    # WiredTiger's cache defaults to half of (memory - 1 GB), and memory here is the whole host
    # (or Docker's VM), shared with every other store. A full read, such as aws-down's mongodump
    # of every replay (task 6.10), grew it to 2.6 GB and got MongoDB OOM-killed locally.
    command: ["--wiredTigerCacheSizeGB", "1"]
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?}
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host \"$$(hostname -i)\" --eval 'db.adminCommand(\"ping\").ok'"]
      interval: 3s
      timeout: 5s
      retries: 30

  mongo-users:
    image: mongo:8.0.34
    command: ["mongosh", "--quiet", "--nodb", "/create-users.js"]
    environment:
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?}
      MONGO_ASSETS_PASSWORD: ${MONGO_ASSETS_PASSWORD:?}
    volumes:
      - ./mongo/create-users.js:/create-users.js:ro
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  kafka:
    image: apache/kafka:4.2.2
    restart: unless-stopped
    # The local broker (infra/kafka/broker.sh, ADR 0013) with SASL_SSL: SCRAM users, ACLs, deny
    # by default, and TLS with the stack's own CA (infra/terraform/stack/kafka.tf). Locally
    # infra/kafka/Dockerfile bakes these files and the OpenTelemetry agent into an image; here they
    # are mounted into the official one, with the agent jar the boot script downloaded and checked
    # (data-host.sh.tftpl), because Amazon Linux's Docker has no buildx for Compose builds.
    entrypoint: ["/bin/bash", "/etc/doodle-arena/kafka-broker.sh"]
    environment:
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:?}
      KAFKA_INIT_PASSWORD: ${KAFKA_INIT_PASSWORD:?}
      KAFKA_BROKER_PASSWORD: ${KAFKA_BROKER_PASSWORD:?}
      # Clients in the VPC reach the broker by the data host's name in the private zone.
      KAFKA_ADVERTISED_HOST: ${DATA_HOST_NAME:?}
      KAFKA_INTERNAL_PROTOCOL: SASL_SSL
      KAFKA_TLS_DIR: /etc/doodle-arena/kafka-tls
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      # The agent: logs and the JMX metrics in infra/kafka/jmx.yaml only (as locally).
      OTEL_SERVICE_NAME: kafka
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=kafka-1,deployment.environment=aws
      # otel-lgtm is on the host network, reached through the bridge's gateway.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
      OTEL_TRACES_EXPORTER: none
      OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED: "false"
      OTEL_INSTRUMENTATION_LOG4J_APPENDER_ENABLED: "true"
      OTEL_JMX_CONFIG: /etc/doodle-arena/kafka-jmx.yaml
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./kafka/broker.sh:/etc/doodle-arena/kafka-broker.sh:ro
      - ./kafka/log4j2.yaml:/etc/doodle-arena/kafka-log4j2.yaml:ro
      - ./kafka/jmx.yaml:/etc/doodle-arena/kafka-jmx.yaml:ro
      - ./kafka/admin.sh:/usr/local/bin/kafka-admin:ro
      - ./kafka-otel/opentelemetry-javaagent.jar:/opt/otel/opentelemetry-javaagent.jar:ro
      - ./kafka-tls:/etc/doodle-arena/kafka-tls:ro
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "bash", "/tmp/healthcheck.sh"]
      interval: 5s
      timeout: 20s
      retries: 30

  kafka-init:
    image: apache/kafka:4.2.2
    entrypoint: ["/bin/bash", "/init.sh"]
    environment:
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_CA_FILE: /etc/doodle-arena/kafka-tls/ca.pem
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:?}
      KAFKA_INIT_PASSWORD: ${KAFKA_INIT_PASSWORD:?}
      KAFKA_BROKER_PASSWORD: ${KAFKA_BROKER_PASSWORD:?}
      KAFKA_GAME_SERVER_PASSWORD: ${KAFKA_GAME_SERVER_PASSWORD:?}
      KAFKA_LOBBY_PASSWORD: ${KAFKA_LOBBY_PASSWORD:?}
      KAFKA_ASSETS_PASSWORD: ${KAFKA_ASSETS_PASSWORD:?}
      KAFKA_MARKETPLACE_PASSWORD: ${KAFKA_MARKETPLACE_PASSWORD:?}
      KAFKA_NOTIFIER_PASSWORD: ${KAFKA_NOTIFIER_PASSWORD:?}
      KAFKA_AUTH_PASSWORD: ${KAFKA_AUTH_PASSWORD:?}
      KAFKA_METRICS_PASSWORD: ${KAFKA_METRICS_PASSWORD:?}
      # No dev-tools user in AWS: its password is left unset, so init.sh skips it.
    volumes:
      - ./kafka/init.sh:/init.sh:ro
      - ./kafka-tls/ca.pem:/etc/doodle-arena/kafka-tls/ca.pem:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  kafka-metrics:
    image: otel/opentelemetry-collector-contrib:0.162.0
    restart: unless-stopped
    # The local config plus TLS to the broker (the stack's CA).
    command: ["--config=/etc/otelcol/config.yaml", "--config=/etc/otelcol/tls.yaml"]
    environment:
      DEPLOYMENT_ENVIRONMENT: aws
      KAFKA_USERNAME: kafka-metrics
      KAFKA_PASSWORD: ${KAFKA_METRICS_PASSWORD:?}
      # otel-lgtm is on the host network (below), reached through the bridge's gateway.
      OTLP_ENDPOINT: http://host.docker.internal:4318
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./observability/kafka-metrics/config.yaml:/etc/otelcol/config.yaml:ro
      - ./observability/kafka-metrics/tls.yaml:/etc/otelcol/tls.yaml:ro
      - ./kafka-tls/ca.pem:/etc/doodle-arena/kafka-tls/ca.pem:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      otel-lgtm:
        condition: service_healthy

  # On the host network, the only container that is: Grafana's CloudWatch data source needs the
  # instance role, and the instance's IMDS hop limit of 1 keeps it from every bridged container.
  # Its ports are the host's: the data host's security group admits only OTLP from the services
  # (4318) and the gateway (4317, and 4319 for the browser's telemetry), and Grafana listens on
  # 127.0.0.1 for the SSM port forward.
  otel-lgtm:
    image: grafana/otel-lgtm:0.36.0
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      # Where people open this Grafana: make aws-grafana's local port, not the host's 3000.
      # Grafana builds the Panel links in Discord alerts and its redirects from it.
      GF_SERVER_ROOT_URL: http://localhost:3300
      DISCORD_ALERT_WEBHOOK_URL: ${DISCORD_ALERT_WEBHOOK_URL:?}
      # Not the image's anonymous Admin: anonymous visitors (through the SSM tunnel) only view;
      # changes need the admin password from SSM (/doodle-arena/stack/grafana-admin-password).
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      # The collector's memory limit, merged over the image's config (the file says why).
      OTELCOL_EXTRA_ARGS: --config=file:/etc/doodle-arena/otelcol-memory-limiter.yaml --config=file:/etc/doodle-arena/otelcol-browser.yaml
    # As in infra/docker-compose.yml: the image's check skips a backend that refuses
    # connections, so Tempo's and the collector's /ready are required too. Docker doesn't
    # restart an unhealthy container; `docker ps` on the data host shows it (docs/setup.md).
    healthcheck:
      test:
        - CMD-SHELL
        - /otel-lgtm/docker/healthcheck.sh >/dev/null
          && curl -fsS -o /dev/null http://127.0.0.1:3200/ready
          && curl -fsS -o /dev/null http://127.0.0.1:13133/ready
      interval: 5s
      timeout: 5s
      retries: 60
    volumes:
      - lgtm-data:/data
      - ./observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/doodle-arena.yaml:ro
      - ./observability/dashboards:/etc/doodle-arena/dashboards:ro
      - ./observability/grafana/alerting/contact-points.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/doodle-arena-contact-points.yaml:ro
      - ./observability/grafana/alerting/policies.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/doodle-arena-policies.yaml:ro
      - ./observability/grafana/alerting/rules.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/doodle-arena-rules.yaml:ro
      - ./grafana-cloudwatch.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/doodle-arena-cloudwatch.yaml:ro
      - ./observability/otelcol/memory-limiter.yaml:/etc/doodle-arena/otelcol-memory-limiter.yaml:ro
      - ./observability/otelcol/browser.yaml:/etc/doodle-arena/otelcol-browser.yaml:ro

volumes:
  postgres-data:
  redis-data:
  mongo-data:
  kafka-data:
  lgtm-data:
