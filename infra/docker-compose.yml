# Local stack for Doodle Arena. Start it with `make up` (scripts/dev-up.sh).
# Image versions are pinned on purpose; see docs/setup.md before bumping one.
# Data stores publish ports on 127.0.0.1 only, for debugging from the host.

name: doodle-arena

# Settings shared by every application service.
x-app: &app
  restart: unless-stopped
  environment: &app-env
    SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
    LOG_LEVEL: info
    DEPLOYMENT_ENVIRONMENT: local
    # OpenTelemetry (docs/observability.md): every signal over OTLP/HTTP to the collector.
    # Each service adds OTEL_SERVICE_NAME and OTEL_RESOURCE_ATTRIBUTES.
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_SEMCONV_STABILITY_OPT_IN: http
    OTEL_METRIC_EXPORT_INTERVAL: "10000"

# The auth database connection, shared by auth and its migrate job.
x-auth-db-env: &auth-db-env
  DB_HOST: postgres
  DB_NAME: auth
  DB_USER: auth
  DB_PASSWORD: ${AUTH_DB_PASSWORD:?}

# Where game servers send finished rounds and matches: stroke logs to SeaweedFS (S3), events
# to Kafka (design doc, section 4.4).
x-game-events-env: &game-events-env
  KAFKA_BROKERS: kafka:9092
  # One Kafka user per service (ADR 0013); both game servers are the principal game-server.
  KAFKA_USERNAME: game-server
  KAFKA_PASSWORD: ${KAFKA_GAME_SERVER_PASSWORD:?}
  S3_ENDPOINT: http://seaweedfs:8333
  # The game-server S3 identity: it may only write round-logs (task 5.5).
  S3_ACCESS_KEY: game-server
  S3_SECRET_KEY: ${S3_GAME_SERVER_SECRET_KEY:?}
  ROUND_LOGS_BUCKET: round-logs

# The assets database, broker and token verification, shared by the web process, the worker and
# the migrate job.
x-assets-env: &assets-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?}
  DB_HOST: postgres
  DB_NAME: assets
  DB_USER: assets
  DB_PASSWORD: ${ASSETS_DB_PASSWORD:?}
  # Redis logical database 1 belongs to assets' Celery (design doc, section 5).
  REDIS_URL: redis://redis:6379/1
  # The assets Redis user: assets:* only (infra/redis/start.sh).
  REDIS_USERNAME: assets
  REDIS_PASSWORD: ${REDIS_ASSETS_PASSWORD:?}
  # Access tokens are verified against auth's JWKS (ADR 0001), fetched on the internal network.
  AUTH_JWKS_URL: http://auth:8080/api/auth/.well-known/jwks.json
  JWT_ISSUER: http://localhost:8080/api/auth
  # The browser-facing origin, for Django's CSRF Origin check behind the gateway.
  PUBLIC_BASE_URL: http://localhost:8080
  # The pipeline (design doc 4.5): stroke logs from round-logs, images to drawings, replays to
  # MongoDB with assets' own user. Kafka is in assets-kafka-env, for two processes only.
  S3_ENDPOINT: http://seaweedfs:8333
  # Browsers load images from presigned URLs signed for this address: SeaweedFS's port published
  # on the host (in AWS, the S3 endpoint itself).
  S3_PUBLIC_ENDPOINT: http://localhost:8333
  # The assets S3 identity: it reads round-logs and reads and writes drawings (task 5.5).
  S3_ACCESS_KEY: assets
  S3_SECRET_KEY: ${S3_ASSETS_SECRET_KEY:?}
  MONGO_URL: mongodb://assets:${MONGO_ASSETS_PASSWORD:?}@mongo:27017/assets
  # Moderation (design doc 4.8). Not a startup dependency: while the AI service is down,
  # drawings retry and then wait in the review queue.
  AI_URL: http://ai:8080

# Kafka for assets' round consumer and outbox relay only (ADR 0013): the web process, the
# Celery worker and beat get no Kafka credential and aren't on the Kafka network, so a bug in
# rendering user drawings can't reach the broker as assets.
x-assets-kafka-env: &assets-kafka-env
  KAFKA_BROKERS: kafka:9092
  KAFKA_USERNAME: assets
  KAFKA_PASSWORD: ${KAFKA_ASSETS_PASSWORD:?}

# Go services check their own /healthz (their runtime image has no shell).
x-go-healthcheck: &go-healthcheck
  test: ["CMD", "/app", "healthcheck"]
  interval: 5s
  timeout: 3s
  retries: 12

# Python services check their health with the interpreter that runs them.
x-py-healthcheck: &py-healthcheck
  test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status != 200)"]
  interval: 5s
  timeout: 3s
  retries: 12

services:
  # ------------------------------------------------------------- Go services

  lobby:
    <<: *app
    build:
      # The repository root, so the image can include proto/gen/go.
      context: ..
      dockerfile: services/lobby/Dockerfile
    environment:
      <<: *app-env
      SERVICE_INSTANCE_ID: lobby-1
      OTEL_SERVICE_NAME: lobby
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=lobby-1,service.version=${SERVICE_VERSION:-0.1.0},deployment.environment=local
      # Internal gRPC port for game-server heartbeats; the gateway never routes it.
      GRPC_PORT: "9090"
      REDIS_ADDR: redis:6379
      # The lobby Redis user: lobby:* only (infra/redis/start.sh).
      REDIS_USERNAME: lobby
      REDIS_PASSWORD: ${REDIS_LOBBY_PASSWORD:?}
      # Access tokens are verified against auth's JWKS (ADR 0001), fetched on the internal network.
      AUTH_JWKS_URL: http://auth:8080/api/auth/.well-known/jwks.json
      JWT_ISSUER: http://localhost:8080/api/auth
      TICKET_PRIVATE_KEY_PATH: /run/secrets/ticket-private-key
      # MatchFinished events for the weekly leaderboard (consumer group lobby-leaderboard).
      KAFKA_BROKERS: kafka:9092
      KAFKA_USERNAME: lobby
      KAFKA_PASSWORD: ${KAFKA_LOBBY_PASSWORD:?}
    secrets:
      - ticket-private-key
    networks: [default, kafka]
    depends_on:
      otel-lgtm:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *go-healthcheck

  # Two game servers, so failover can be tested (task 2.5).
  game-server-1:
    <<: *app
    build:
      # The repository root, so the image can include proto/gen/go.
      context: ..
      dockerfile: services/game-server/Dockerfile
    environment:
      <<: [*app-env, *game-events-env]
      SERVICE_INSTANCE_ID: game-server-1
      OTEL_SERVICE_NAME: game-server
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=game-server-1,service.version=${SERVICE_VERSION:-0.1.0},deployment.environment=local
      # Heartbeats go to the lobby; the lobby calls back on this server's GRPC_PORT.
      GRPC_PORT: "9090"
      LOBBY_GRPC_ADDR: lobby:9090
      CONTROL_ADDRESS: game-server-1:9090
      WS_ADDRESS: /ws/game-server-1
      REDIS_ADDR: redis:6379
      # The game-server Redis user: room:* and ticket:* only (infra/redis/start.sh).
      REDIS_USERNAME: game-server
      REDIS_PASSWORD: ${REDIS_GAME_SERVER_PASSWORD:?}
      # The lobby's public keys only: game servers verify join tickets, never mint them (ADR 0005).
      TICKET_PUBLIC_KEY_PATH: /run/secrets/ticket-public-key
      # Browsers send Origin http://localhost:8080; the gateway forwards Host without the port.
      WS_ALLOWED_ORIGINS: localhost:8080
    secrets:
      - ticket-public-key
    networks: [default, kafka]
    # SIGTERM drains (task 5.5): the server waits up to DRAIN_TIMEOUT (45 s) for the lobby to
    # move its rooms, so docker stop must wait longer than its 10-second default, like ECS (60 s).
    stop_grace_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      seaweedfs-buckets:
        condition: service_completed_successfully
    healthcheck: *go-healthcheck

  game-server-2:
    <<: *app
    build:
      # The repository root, so the image can include proto/gen/go.
      context: ..
      dockerfile: services/game-server/Dockerfile
    environment:
      <<: [*app-env, *game-events-env]
      SERVICE_INSTANCE_ID: game-server-2
      OTEL_SERVICE_NAME: game-server
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=game-server-2,service.version=${SERVICE_VERSION:-0.1.0},deployment.environment=local
      # Heartbeats go to the lobby; the lobby calls back on this server's GRPC_PORT.
      GRPC_PORT: "9090"
      LOBBY_GRPC_ADDR: lobby:9090
      CONTROL_ADDRESS: game-server-2:9090
      WS_ADDRESS: /ws/game-server-2
      REDIS_ADDR: redis:6379
      # The game-server Redis user: room:* and ticket:* only (infra/redis/start.sh).
      REDIS_USERNAME: game-server
      REDIS_PASSWORD: ${REDIS_GAME_SERVER_PASSWORD:?}
      # The lobby's public keys only: game servers verify join tickets, never mint them (ADR 0005).
      TICKET_PUBLIC_KEY_PATH: /run/secrets/ticket-public-key
      # Browsers send Origin http://localhost:8080; the gateway forwards Host without the port.
      WS_ALLOWED_ORIGINS: localhost:8080
    secrets:
      - ticket-public-key
    networks: [default, kafka]
    # SIGTERM drains (task 5.5): the server waits up to DRAIN_TIMEOUT (45 s) for the lobby to
    # move its rooms, so docker stop must wait longer than its 10-second default, like ECS (60 s).
    stop_grace_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      seaweedfs-buckets:
        condition: service_completed_successfully
    healthcheck: *go-healthcheck

  notifier:
    <<: *app
    # Built from the repository root, for the generated contracts in proto/gen/go.
    build:
      context: ..
      dockerfile: services/notifier/Dockerfile
    environment:
      <<: *app-env
      SERVICE_INSTANCE_ID: notifier-1
      OTEL_SERVICE_NAME: notifier
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=notifier-1,service.version=${SERVICE_VERSION:-0.1.0},deployment.environment=local
      # Endpoints and deliveries (design doc 4.7). Migrated at startup.
      DB_HOST: postgres
      DB_NAME: notifier
      DB_USER: notifier
      DB_PASSWORD: ${NOTIFIER_DB_PASSWORD:?}
      # API keys are checked on auth's internal port, which compose never publishes (ADR 0001).
      AUTH_INTERNAL_URL: http://auth:9091
      # The web app's access tokens are verified against auth's JWKS (ADR 0001).
      AUTH_JWKS_URL: http://auth:8080/api/auth/.well-known/jwks.json
      JWT_ISSUER: http://localhost:8080/api/auth
      # Encrypts the endpoints' signing secrets at rest (ADR 0014).
      NOTIFIER_SECRET_KEY: ${NOTIFIER_SECRET_KEY:?}
      # SaleCompleted and CoinsCredited in, DeliveryDead out.
      KAFKA_BROKERS: kafka:9092
      KAFKA_USERNAME: notifier
      KAFKA_PASSWORD: ${KAFKA_NOTIFIER_PASSWORD:?}
      # The only host allowed to resolve to a private address (and to use http): the local test
      # receiver below. Empty in AWS (ADR 0014).
      NOTIFIER_ALLOWED_PRIVATE_HOSTS: webhook-receiver
    networks: [default, kafka]
    depends_on:
      otel-lgtm:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *go-healthcheck

  # --------------------------------------------------------- Python services

  # One-shot job: applies the auth database migrations, then exits. auth starts only after it
  # succeeds, so replicas never race on a migration.
  auth-migrate:
    build:
      context: ..
      dockerfile: services/auth/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: [*app-env, *auth-db-env]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  auth:
    <<: *app
    build:
      context: ..
      dockerfile: services/auth/Dockerfile
    environment:
      <<: [*app-env, *auth-db-env]
      SERVICE_INSTANCE_ID: auth-1
      OTEL_SERVICE_NAME: auth
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=auth-1,service.version=${SERVICE_VERSION:-0.1.0},deployment.environment=local
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private-key
      # Empty Google credentials keep the stack running; sign-in then returns 503.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:?}
      PUBLIC_BASE_URL: http://localhost:8080
      COOKIE_SECURE: "false"
    secrets:
      - jwt-private-key
    depends_on:
      otel-lgtm:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    healthcheck: *py-healthcheck

  # The outbox relay (ADR 0015): publishes auth's events (CredentialsRevoked on auth.users.v1)
  # to Kafka. Same image as auth; no key mount, no port.
  auth-relay:
    <<: *app
    build:
      context: ..
      dockerfile: services/auth/Dockerfile
    command: ["python", "-m", "app.relay"]
    environment:
      <<: [*app-env, *auth-db-env]
      SERVICE_INSTANCE_ID: auth-relay-1
      OTEL_SERVICE_NAME: auth
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=auth-relay-1,service.version=${SERVICE_VERSION:-0.1.0},deployment.environment=local
      KAFKA_BROKERS: kafka:9092
      KAFKA_USERNAME: auth
      KAFKA_PASSWORD: ${KAFKA_AUTH_PASSWORD:?}
    networks: [default, kafka]
    depends_on:
      otel-lgtm:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      # The relay loop touches this file on every pass, even while Kafka is down.
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/relay-alive') > 30)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  ai:
    <<: *app
    build: ../services/ai
    environment:
      <<: *app-env
      SERVICE_INSTANCE_ID: ai-1
      OTEL_SERVICE_NAME: ai
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=ai-1,service.version=${SERVICE_VERSION:-0.1.0},deployment.environment=local
      # The moderation stub's starting behaviour. scripts/ai-mode.sh changes it at runtime
      # through the internal port 9091, which is never published or routed.
      MODERATION_MODE: approve
      MODERATION_DELAY_MS: "0"
      MODERATION_FAILURE_RATE: "0"
    depends_on:
      otel-lgtm:
        condition: service_healthy
    healthcheck: *py-healthcheck

  # One-shot job: applies the assets database migrations, then exits. The web process and the
  # worker start only after it succeeds.
  assets-migrate:
    build:
      context: ..
      dockerfile: services/assets/Dockerfile
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      <<: [*app-env, *assets-env]
      SERVICE_INSTANCE_ID: assets-migrate
      OTEL_SERVICE_NAME: assets
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # gunicorn: the REST API and the Django admin (the moderation console).
  assets:
    <<: *app
    build:
      context: ..
      dockerfile: services/assets/Dockerfile
    environment:
      <<: [*app-env, *assets-env]
      SERVICE_INSTANCE_ID: assets-1
      OTEL_SERVICE_NAME: assets
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=assets-1,service.version=${SERVICE_VERSION:-0.1.0},deployment.environment=local
    depends_on:
      otel-lgtm:
        condition: service_healthy
      assets-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs-buckets:
        condition: service_completed_successfully
    healthcheck: *py-healthcheck

  # The Celery worker: the drawing pipeline (design doc 4.5). Same image, same settings.
  assets-worker:
    <<: *app
    build:
      context: ..
      dockerfile: services/assets/Dockerfile
    command: ["celery", "-A", "config", "worker", "--hostname", "worker@%h", "--concurrency", "2"]
    environment:
      <<: [*app-env, *assets-env]
      SERVICE_INSTANCE_ID: assets-worker-1
      OTEL_SERVICE_NAME: assets
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=assets-worker-1,service.version=${SERVICE_VERSION:-0.1.0},deployment.environment=local
    depends_on:
      otel-lgtm:
        condition: service_healthy
      assets-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mongo-users:
        condition: service_completed_successfully
      seaweedfs-buckets:
        condition: service_completed_successfully
    # SIGTERM is a warm shutdown: the worker finishes its current tasks first.
    stop_grace_period: 30s
    healthcheck:
      # The worker answers a broadcast ping over the broker. Loading Django takes a second or two.
      test: ["CMD-SHELL", "celery -A config inspect ping --destination worker@$$HOSTNAME --timeout 5 >/dev/null"]
      interval: 15s
      timeout: 15s
      start_period: 20s
      retries: 5

  # Reads RoundFinished from game.rounds.v1 and starts a drawing for each round.
  assets-consumer:
    <<: *app
    build:
      context: ..
      dockerfile: services/assets/Dockerfile
    command: ["python", "manage.py", "consume_rounds"]
    environment:
      <<: [*app-env, *assets-env, *assets-kafka-env]
      SERVICE_INSTANCE_ID: assets-consumer-1
      OTEL_SERVICE_NAME: assets
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=assets-consumer-1,service.version=${SERVICE_VERSION:-0.1.0},deployment.environment=local
    networks: [default, kafka]
    depends_on:
      otel-lgtm:
        condition: service_healthy
      assets-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # The poll loop touches this file every second, even while Kafka is down.
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/consumer-alive') > 30)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Publishes the outbox (DrawingApproved, DrawingRejected) to assets.drawings.v1.
  assets-relay:
    <<: *app
    build:
      context: ..
      dockerfile: services/assets/Dockerfile
    command: ["python", "manage.py", "relay_outbox"]
    environment:
      <<: [*app-env, *assets-env, *assets-kafka-env]
      SERVICE_INSTANCE_ID: assets-relay-1
      OTEL_SERVICE_NAME: assets
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=assets-relay-1,service.version=${SERVICE_VERSION:-0.1.0},deployment.environment=local
    networks: [default, kafka]
    depends_on:
      otel-lgtm:
        condition: service_healthy
      assets-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      # The relay loop touches this file on every pass, even while Kafka is down.
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/relay-alive') > 30)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Celery beat: runs the recovery sweeper every minute. Exactly one may run, or the sweep runs
  # twice (harmless, since the sweeper locks with SKIP LOCKED, but wasteful).
  assets-beat:
    <<: *app
    build:
      context: ..
      dockerfile: services/assets/Dockerfile
    command: ["celery", "-A", "config", "beat", "--schedule", "/tmp/celerybeat-schedule", "--pidfile="]
    environment:
      <<: [*app-env, *assets-env]
      SERVICE_INSTANCE_ID: assets-beat-1
      OTEL_SERVICE_NAME: assets
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=assets-beat-1,service.version=${SERVICE_VERSION:-0.1.0},deployment.environment=local
    depends_on:
      assets-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # Beat rewrites its schedule store (a SQLite WAL) whenever it sends the sweep, once a
      # minute; a stalled beat stops touching it.
      test: ["CMD", "python", "-c", "import glob, os, sys, time; sys.exit(time.time() - max(os.path.getmtime(f) for f in glob.glob('/tmp/celerybeat-schedule*')) > 180)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # A test endpoint for webhook drills (scripts/drills/webhooks.py): verifies signatures and
  # answers 200 or 500 as told. Its admin API is published on localhost only.
  webhook-receiver:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/notifier/Dockerfile
      args:
        CMD: webhook-receiver
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck: *go-healthcheck

  # ----------------------------------------------------------- Java services

  marketplace:
    <<: *app
    # Built from the repository root, for the generated contracts in proto/gen/java.
    build:
      context: ..
      dockerfile: services/marketplace/Dockerfile
    environment:
      <<: *app-env
      SERVICE_INSTANCE_ID: marketplace-1
      OTEL_SERVICE_NAME: marketplace
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=marketplace-1,service.version=${SERVICE_VERSION:-0.1.0},deployment.environment=local
      # The ledger (design doc, section 8). Flyway migrates it at startup.
      DB_HOST: postgres
      DB_NAME: marketplace
      DB_USER: marketplace
      DB_PASSWORD: ${MARKETPLACE_DB_PASSWORD:?}
      # Access tokens are verified against auth's JWKS (ADR 0001), fetched on the internal network.
      AUTH_JWKS_URL: http://auth:8080/api/auth/.well-known/jwks.json
      JWT_ISSUER: http://localhost:8080/api/auth
      # DrawingApproved and MatchFinished in, the outbox out.
      KAFKA_BROKERS: kafka:9092
      KAFKA_USERNAME: marketplace
      KAFKA_PASSWORD: ${KAFKA_MARKETPLACE_PASSWORD:?}
      # Stripe test mode (docs/setup.md). Empty is allowed: coin packs then answer 503.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Where Stripe Checkout sends the browser back to.
      PUBLIC_BASE_URL: http://localhost:8080
    networks: [default, kafka]
    depends_on:
      otel-lgtm:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  # ------------------------------------------------------------------- gateway

  # The only entry point from the host: everything is one origin at http://localhost:8080.
  gateway:
    build: ../services/gateway
    restart: unless-stopped
    environment:
      # Rendered into nginx.conf at start (the gateway has no OTEL_* settings of its own).
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      SERVICE_INSTANCE_ID: gateway-1
    depends_on:
      otel-lgtm:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ------------------------------------------------------------------- web app

  web:
    build:
      context: ../web
      target: dev
    restart: unless-stopped
    environment:
      VITE_HMR_CLIENT_PORT: "8080"
    volumes:
      # Edits on the host reload in the browser. node_modules stays inside the container,
      # because the host's copy is built for macOS.
      - ../web:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ---------------------------------------------------------------- data stores

  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make up to create .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      ASSETS_DB_PASSWORD: ${ASSETS_DB_PASSWORD:?}
      MARKETPLACE_DB_PASSWORD: ${MARKETPLACE_DB_PASSWORD:?}
      NOTIFIER_DB_PASSWORD: ${NOTIFIER_DB_PASSWORD:?}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 15432 on the host, so a Postgres installed on the host (5432) doesn't clash.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.2-trixie
    # One ACL user per service and key prefix, the default user off (infra/redis/start.sh).
    entrypoint: ["sh", "/etc/doodle-arena/redis-start.sh"]
    environment:
      REDIS_ADMIN_PASSWORD: ${REDIS_ADMIN_PASSWORD:?}
      REDIS_LOBBY_PASSWORD: ${REDIS_LOBBY_PASSWORD:?}
      REDIS_GAME_SERVER_PASSWORD: ${REDIS_GAME_SERVER_PASSWORD:?}
      REDIS_ASSETS_PASSWORD: ${REDIS_ASSETS_PASSWORD:?}
    volumes:
      - redis-data:/data
      - ./redis/start.sh:/etc/doodle-arena/redis-start.sh:ro
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      # redis-cli reads the password from REDISCLI_AUTH, so it's not on the command line.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_ADMIN_PASSWORD\" redis-cli --user admin ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  mongo:
    image: mongo:8.0.34
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?}
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      # Through the container's network address, not localhost: on a new volume the image first
      # runs a temporary server on 127.0.0.1 to create the root user, and a localhost ping would
      # pass about two seconds before the real server accepts other containers.
      test: ["CMD-SHELL", "mongosh --quiet --host \"$$(hostname -i)\" --eval 'db.adminCommand(\"ping\").ok'"]
      interval: 3s
      timeout: 5s
      retries: 30

  # One-shot job: creates (or updates) the assets MongoDB user, on new and existing volumes.
  mongo-users:
    image: mongo:8.0.34
    command: ["mongosh", "--quiet", "--nodb", "/create-users.js"]
    environment:
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?}
      MONGO_ASSETS_PASSWORD: ${MONGO_ASSETS_PASSWORD:?}
    volumes:
      - ./mongo/create-users.js:/create-users.js:ro
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  kafka:
    image: apache/kafka:4.2.2
    # SCRAM-SHA-512 users and ACLs, deny by default (ADR 0013): infra/kafka/broker.sh writes the
    # broker config and formats the storage with the admin credential on first start.
    entrypoint: ["/bin/bash", "/etc/doodle-arena/kafka-broker.sh"]
    environment:
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:?}
      KAFKA_INIT_PASSWORD: ${KAFKA_INIT_PASSWORD:?}
      KAFKA_BROKER_PASSWORD: ${KAFKA_BROKER_PASSWORD:?}
      KAFKA_ADVERTISED_HOST: kafka
      # 9094 for host tools (tools/eventctl, the drills), as the dev-tools user.
      KAFKA_EXTERNAL: "1"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./kafka/broker.sh:/etc/doodle-arena/kafka-broker.sh:ro
      - ./kafka/log4j2.yaml:/etc/doodle-arena/kafka-log4j2.yaml:ro
    # Only Kafka's clients share this network (ADR 0013): the gateway, auth, the AI service and
    # the assets web process and worker can't reach the broker at all.
    networks: [kafka]
    ports:
      - "127.0.0.1:9094:9094"
    healthcheck:
      test: ["CMD", "bash", "/tmp/healthcheck.sh"]
      interval: 5s
      timeout: 20s
      retries: 30

  # One-shot job, as admin: topics, one user per service and the ACLs (infra/kafka/init.sh).
  # Services that use Kafka depend on it with service_completed_successfully, so they start
  # after their user and grants exist (and `compose up --wait` accepts the job exiting).
  kafka-init:
    image: apache/kafka:4.2.2
    entrypoint: ["/bin/bash", "/init.sh"]
    environment:
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:?}
      KAFKA_INIT_PASSWORD: ${KAFKA_INIT_PASSWORD:?}
      KAFKA_BROKER_PASSWORD: ${KAFKA_BROKER_PASSWORD:?}
      KAFKA_GAME_SERVER_PASSWORD: ${KAFKA_GAME_SERVER_PASSWORD:?}
      KAFKA_LOBBY_PASSWORD: ${KAFKA_LOBBY_PASSWORD:?}
      KAFKA_ASSETS_PASSWORD: ${KAFKA_ASSETS_PASSWORD:?}
      KAFKA_MARKETPLACE_PASSWORD: ${KAFKA_MARKETPLACE_PASSWORD:?}
      KAFKA_NOTIFIER_PASSWORD: ${KAFKA_NOTIFIER_PASSWORD:?}
      KAFKA_AUTH_PASSWORD: ${KAFKA_AUTH_PASSWORD:?}
      KAFKA_METRICS_PASSWORD: ${KAFKA_METRICS_PASSWORD:?}
      KAFKA_DEV_TOOLS_PASSWORD: ${KAFKA_DEV_TOOLS_PASSWORD:?}
    volumes:
      - ./kafka/init.sh:/init.sh:ro
    networks: [kafka]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      # One identity per service (infra/seaweedfs/entrypoint.sh); S3_ACCESS_KEY is dev-tools'.
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      S3_GAME_SERVER_SECRET_KEY: ${S3_GAME_SERVER_SECRET_KEY:?}
      S3_ASSETS_SECRET_KEY: ${S3_ASSETS_SECRET_KEY:?}
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-shot job; the game servers and assets depend on it, like kafka-init.
  seaweedfs-buckets:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "/create-buckets.sh"]
    volumes:
      - ./seaweedfs/create-buckets.sh:/create-buckets.sh:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

  # ------------------------------------------------------------- observability

  kafka-metrics:
    # Broker-side consumer-group lag for every consumer (the ConsumerLagGrowing alert), pushed to
    # otel-lgtm over OTLP. Version matches the collector bundled in otel-lgtm.
    image: otel/opentelemetry-collector-contrib:0.162.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      DEPLOYMENT_ENVIRONMENT: local
      OTLP_ENDPOINT: http://otel-lgtm:4318
      KAFKA_USERNAME: kafka-metrics
      KAFKA_PASSWORD: ${KAFKA_METRICS_PASSWORD:?}
    volumes:
      - ./observability/kafka-metrics/config.yaml:/etc/otelcol/config.yaml:ro
    networks: [default, kafka]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      otel-lgtm:
        condition: service_healthy

  otel-lgtm:
    # Collector, Prometheus, Tempo, Loki and Grafana in one container (development only).
    image: grafana/otel-lgtm:0.36.0
    environment:
      # CI sets this to see the collector's and Loki's own logs (otel-lgtm hides them by default).
      ENABLE_LOGS_OTELCOL: ${OTEL_LGTM_COMPONENT_LOGS:-false}
      ENABLE_LOGS_LOKI: ${OTEL_LGTM_COMPONENT_LOGS:-false}
      # Read by the Discord contact point (infra/observability/grafana/alerting/). Without a
      # Discord webhook in .env, alerts go to the webhook-receiver test service instead.
      DISCORD_ALERT_WEBHOOK_URL: ${DISCORD_ALERT_WEBHOOK_URL:-http://webhook-receiver:9000/hooks/alerts}
      # The collector's memory limit, merged over the image's config (the file says why).
      OTELCOL_EXTRA_ARGS: --config=file:/etc/doodle-arena/otelcol-memory-limiter.yaml --config=file:/etc/doodle-arena/otelcol-browser.yaml
    # The image's own check (every backend ready, Loki included), run more often than its 30 s
    # default: every service waits for it, so records never queue up behind a starting Loki.
    # After startup the image's check skips a backend that refuses connections, so a Tempo or
    # collector killed later (the Docker VM's OOM killer) would still pass: both are required.
    healthcheck:
      test:
        - CMD-SHELL
        - /otel-lgtm/docker/healthcheck.sh >/dev/null
          && curl -fsS -o /dev/null http://127.0.0.1:3200/ready
          && curl -fsS -o /dev/null http://127.0.0.1:13133/ready
      interval: 3s
      timeout: 5s
      retries: 60
    volumes:
      - lgtm-data:/data
      # Dashboards and alerting as code, next to the image's own provisioning files.
      - ./observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/doodle-arena.yaml:ro
      - ./observability/dashboards:/etc/doodle-arena/dashboards:ro
      - ./observability/grafana/alerting/contact-points.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/doodle-arena-contact-points.yaml:ro
      - ./observability/grafana/alerting/policies.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/doodle-arena-policies.yaml:ro
      - ./observability/grafana/alerting/rules.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/doodle-arena-rules.yaml:ro
      - ./observability/otelcol/memory-limiter.yaml:/etc/doodle-arena/otelcol-memory-limiter.yaml:ro
      - ./observability/otelcol/browser.yaml:/etc/doodle-arena/otelcol-browser.yaml:ro
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

# Kafka's own network (ADR 0013), joined only by Kafka clients.
networks:
  kafka:

volumes:
  postgres-data:
  redis-data:
  mongo-data:
  kafka-data:
  seaweedfs-data:
  lgtm-data:

secrets:
  # Created by scripts/gen-jwt-key.sh (make up runs it). Local development only.
  jwt-private-key:
    file: ../secrets/jwt-private.pem
  # Created by scripts/gen-ticket-key.sh (make up runs it). Only the lobby gets it (ADR 0005).
  ticket-private-key:
    file: ../secrets/ticket-private.pem
  ticket-public-key:
    file: ../secrets/ticket-public.pem
