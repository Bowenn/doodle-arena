# The primary's client authentication (ADR 0020), mounted and named with hba_file, so it applies
# to an existing data volume too (the image writes its own pg_hba.conf only into a new one).
# The image's own rules, then one line for the replica's streaming user.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
# The replica streams WAL as replicator (REPLICATION, nothing else), with a password.
host    replication     replicator      all                     scram-sha-256
host    all             all             all                     scram-sha-256
