# The production web app (ADR 0003): static files behind the gateway, which owns TLS, rate
# limits and tracing. Vite's hashed files never change, so browsers keep them; index.html is
# always revalidated, so a deploy reaches every browser on its next load.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log off;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/rooms/..., /wallet, /moderate) all load the app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
