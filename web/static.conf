# The production web app (ADR 0003): static files behind the gateway, which owns TLS, rate
# limits and tracing. Vite's hashed files never change, so browsers keep them; index.html is
# always revalidated, so a deploy reaches every browser on its next load.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log off;

    # Neither the ALB nor the gateway compresses, so the app's own files are gzipped here
    # (task 5.4: the main bundle goes from 279 KB to 85 KB on the wire; level 6 is 16%
    # smaller than the default level 1 for little CPU, and these files are cached for a year).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/rooms/..., /wallet, /moderate) all load the app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
