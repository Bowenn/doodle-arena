syntax = "proto3";

package doodle.game.v1;

import "doodle/game/v1/game.proto";

// ControlService is served by every game server and called by the lobby. Every call has a
// deadline.
service ControlService {
  // AllocateRoom creates a room actor on this server and takes the room's lease.
  // Idempotent for the same room_id: the lobby retries on timeouts, and failover allocates a
  // dead server's rooms again. Errors: RESOURCE_EXHAUSTED when the server is full,
  // FAILED_PRECONDITION while it drains.
  rpc AllocateRoom(AllocateRoomRequest) returns (AllocateRoomResponse);
  // DrainServer stops this server from accepting new rooms before a deploy. Existing rooms
  // finish their rounds or are handed off; the server shuts down when none are left.
  rpc DrainServer(DrainServerRequest) returns (DrainServerResponse);
}

// AllocateRoomRequest asks a game server to own a room.
message AllocateRoomRequest {
  // The room to create or take over.
  string room_id = 1;
  // Rule set for the room.
  GameMode mode = 2;
  // Room settings chosen by the host. Ignored when the room already exists (failover
  // restores settings from the room's snapshot).
  RoomSettings settings = 3;
  // User id of the player who created the room; only the host can start a match. If the host
  // isn't connected, hosting passes to the earliest-joined connected player. Empty means the
  // first player to join hosts. Ignored when the room already exists.
  string host_user_id = 4;
  // The game server the lobby means (its heartbeat server_id). A server with another id
  // refuses with FAILED_PRECONDITION and creates nothing: a cached connection can reach the
  // wrong instance after containers are recreated and swap IP addresses. Empty skips the check.
  string server_id = 5;
  // The room can be watched through relays (ADR 0017), so its viewers may guess (ADR 0019): the
  // owner then reads the room's viewer guesses from Redis. The lobby sends it on every
  // allocation, a takeover included, because a new owner has no other way to know.
  bool live = 6;
}

// RoomSettings are the host's choices for a room. A value of 0 means the server's default.
message RoomSettings {
  // Maximum number of players (default 8).
  uint32 max_players = 1;
  // Seconds the drawer has to choose a word (default 10).
  uint32 choose_seconds = 2;
  // Seconds to draw (default 80).
  uint32 draw_seconds = 3;
  // Number of words offered to the drawer (default 3).
  uint32 word_options = 4;
}

// AllocateRoomResponse says where players connect.
message AllocateRoomResponse {
  // The game server that now owns the room.
  string server_id = 1;
  // WebSocket address of that server, which the lobby turns into the client's URL (ADR 0002).
  string ws_address = 2;
}

// DrainServerRequest has no fields; draining applies to the whole server.
message DrainServerRequest {}

// DrainServerResponse reports progress.
message DrainServerResponse {
  // Rooms still running on this server.
  uint32 rooms_remaining = 1;
}
