syntax = "proto3";

package doodle.game.v1;

import "google/protobuf/timestamp.proto";

// StrokeLog is every stroke of one round. It is not a Kafka event: the game server uploads it,
// gzip-compressed, to the round-logs bucket at "<match_id>/<round_no>.binpb.gz", and
// RoundFinished carries only that key (claim check). Assets fetches it to render the drawing
// and stores it as a replay. Objects expire after 7 days.
message StrokeLog {
  // Version of this format, starting at 1.
  uint32 schema_version = 1;
  // The match the round belongs to.
  string match_id = 2;
  // The room it was played in.
  string room_id = 3;
  // Round number within the match, starting at 1.
  uint32 round_no = 4;
  // Canvas width the drawers used, in pixels (aspect ratio only; points are normalized).
  uint32 canvas_width = 5;
  // Canvas height the drawers used, in pixels.
  uint32 canvas_height = 6;
  // When the drawing phase started, by the game server's clock.
  google.protobuf.Timestamp round_started_at = 7;
  // Strokes in the order the game server processed them (the authoritative order).
  repeated Stroke strokes = 8;
}

// Stroke is one continuous line drawn by one player.
message Stroke {
  // Id the client gave the stroke; unique within the round.
  string stroke_id = 1;
  // The drawer who made it.
  string user_id = 2;
  // Color as "#rrggbb".
  string color = 3;
  // Line width in normalized units (0-10000 scale, like the points).
  uint32 width = 4;
  // The points of the line, in drawing order.
  repeated Point points = 5;
  // True when the drawer undid this stroke. Replays skip it; renderers leave it out.
  bool undone = 6;
  // Milliseconds after round_started_at when the game server received the stroke's last
  // batch, by the server's clock. Used for ordering and replay timing.
  uint32 server_received_ms = 7;
}

// Point is one sample of a stroke.
message Point {
  // Horizontal position, 0-10000 (normalized, so canvas size doesn't matter).
  uint32 x = 1;
  // Vertical position, 0-10000.
  uint32 y = 2;
  // Milliseconds since the stroke started, by the client's clock. Only paces replays; never
  // used for game logic, because clients are not trusted.
  uint32 t_ms = 3;
}
