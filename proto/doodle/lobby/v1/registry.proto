syntax = "proto3";

package doodle.lobby.v1;

// RegistryService is served by the lobby and called by every game server and relay.
service RegistryService {
  // Heartbeat reports that a game server is alive, every 2 seconds. A server whose heartbeat
  // stops for 6 seconds is treated as dead, and its rooms are allocated elsewhere.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

// HeartbeatRequest is a game server's current state.
message HeartbeatRequest {
  // Stable id of the game server, for example "game-server-1".
  string server_id = 1;
  // Address clients use to reach this server's WebSocket endpoint (ADR 0002).
  string ws_address = 2;
  // Rooms this server currently owns. Lets the lobby reassign them if the server dies.
  // The same ids as in `rooms`; kept because field 3 is part of the published contract.
  repeated string room_ids = 3;
  // Open WebSocket connections, used as the load figure for least-loaded allocation.
  uint32 sockets = 4;
  // True while the server drains before a deploy; the lobby sends it no new rooms.
  bool draining = 5;
  // Status of every room this server owns, so the lobby can show player counts and send
  // quick-play players to a room with space.
  repeated RoomStatus rooms = 6;
  // host:port of this server's ControlService (gRPC), which the lobby dials for AllocateRoom,
  // for example "game-server-1:9090". Internal only; the gateway never routes it. Empty from a
  // relay, which takes no rooms.
  string control_address = 7;
  // What the server does (ADR 0017). Unspecified is a game server, as before this field.
  ServerRole role = 8;
  // A relay's open viewer sockets, its load figure for watch placement.
  uint32 viewers = 9;
  // A relay's viewers per room it streams. A relay owns no rooms: room_ids and rooms stay empty.
  repeated WatchedRoom watched = 10;
}

// ServerRole tells game servers, which own rooms, from relays, which fan rooms out to viewers.
enum ServerRole {
  // Not reported: a game server.
  SERVER_ROLE_UNSPECIFIED = 0;
  // Owns rooms and runs their games.
  SERVER_ROLE_GAME = 1;
  // Reads rooms' event streams and sends them to viewers (ADR 0017). Never allocated rooms.
  SERVER_ROLE_RELAY = 2;
}

// WatchedRoom is one room a relay streams, with how many viewers it has there.
message WatchedRoom {
  // The room's id.
  string room_id = 1;
  // Viewers connected to this relay for the room.
  uint32 viewers = 2;
}

// RoomStatus is one room as its game server sees it, reported in every heartbeat.
message RoomStatus {
  // The room's id, as given in AllocateRoom.
  string room_id = 1;
  // Players currently connected to the room.
  uint32 players = 2;
  // Where the room is in its lifecycle.
  RoomPhase phase = 3;
  // Seats held: connected players plus those within their rejoin grace (and, during a match,
  // every player who joined it). The room is full when seats reaches max_players. 0 means not
  // reported (an older game server): the lobby then uses players.
  uint32 seats = 4;
}

// RoomPhase is the coarse state of a room that the lobby needs; the round state machine itself
// stays inside the game server.
enum RoomPhase {
  // Not reported. The lobby treats the room as waiting.
  ROOM_PHASE_UNSPECIFIED = 0;
  // No match is running; quick play prefers these rooms.
  ROOM_PHASE_WAITING = 1;
  // A match is running.
  ROOM_PHASE_PLAYING = 2;
}

// HeartbeatResponse is empty for now; fields can be added later without breaking callers.
message HeartbeatResponse {}
