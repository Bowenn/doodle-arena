# Hand-written; `make proto` only replaces the doodle/ package.
# Services depend on it with: uv add --editable ../../proto/gen/python
# Runtime versions must match the plugin versions in proto/buf.gen.yaml.
[project]
name = "doodle-proto"
version = "0.1.0"
description = "Generated protobuf and gRPC code for Doodle Arena contracts"
requires-python = "==3.14.*"
dependencies = [
    "grpcio>=1.84.0,<2",
    "protobuf>=7.36.2,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doodle"]

[tool.uv]
required-version = ">=0.13"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["doodle"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
